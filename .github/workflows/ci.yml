name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t triage:ci .
      - name: Start container
        run: docker run -d --name triage -p 80:80 triage:ci
      - name: Smoke test
        run: |
          if ! bash scripts/smoke_test.sh http://localhost:80 v0.2; then
            docker logs triage
            exit 1
          fi
      - name: Stop container
        if: always()
        run: docker rm -f triage

  train-smoke:
    name: Training smoke (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [v0.1, v0.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Train model
        run: python -m triage.train --version ${{ matrix.version }} --out artifacts
      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ matrix.version }}
          path: artifacts/
          if-no-files-found: error

  cv-comparison:
    name: Cross-validation comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run repeated cross-validation
        run: python -m triage.evaluate --out metrics/cv_comparison.json
      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: cv-comparison
          path: metrics/cv_comparison.json
          if-no-files-found: error
