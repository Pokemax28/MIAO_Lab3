name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, test, publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: MODEL_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name triage -p 80:80 "$IMAGE:$VERSION"

      - name: Container smoke tests
        run: |
          if ! bash scripts/smoke_test.sh http://localhost:80 "$VERSION"; then
            docker logs triage
            exit 1
          fi

      - name: Collect metrics from the image
        run: docker cp triage:/app/artifacts/metrics.json "metrics-${VERSION}.json"

      - name: Stop container
        if: always()
        run: docker rm -f triage

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push "$IMAGE:$VERSION"

      - name: Prepare release notes
        run: |
          awk -v ver="$VERSION" '
            /^## / { if (found) exit; if ($2 == ver) found = 1 }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section found for ${VERSION}" >&2
            exit 1
          fi
          {
            echo
            echo "### Metrics from the released image (held-out split)"
            echo
            echo '```json'
            cat "metrics-${VERSION}.json"
            echo '```'
            echo
            echo "Image: \`${IMAGE}:${VERSION}\`"
          } >> notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "metrics-${VERSION}.json" \
            --verify-tag --title "$VERSION" --notes-file notes.md
